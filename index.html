<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Speak Number Guessing Game</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <img src="img/mic.png" alt="Microphone to speak into" />
    <h1>Guess a Number Between 1 – 100</h1>
    <h3>Click the microphone button, then say a number</h3>
    <button id="listen" type="button">Start listening</button>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="msg" class="msg"></div>
  </body>
</html>
